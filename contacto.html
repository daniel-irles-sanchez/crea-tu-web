<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Studios - Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .mapa {
      width: 100%;
      height: 400px;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <div class="logo h3 mb-0">Focus Studios</div>
    <nav>
      <ul class="nav">
        <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="galeria.html">Portafolio</a></li>
        <li class="nav-item"><a class="nav-link active text-white" href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contacto -->
  <section class="container text-center my-5">
    <h2>Contacto</h2>
  </section>

  <!-- Formulario y Mapa -->
  <section class="container my-5">
    <div class="row">
      <div class="col-md-6">
        <h4>Rellena el formulario</h4>
        <form id="contactForm">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required pattern="[A-Za-z\s]{3,40}" title="Solo letras y espacios, entre 3 y 40 caracteres">
          </div>
          <div class="mb-3">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="apellidos" name="apellidos" required pattern="[A-Za-z\s]{4,60}" title="Solo letras y espacios, entre 4 y 60 caracteres">
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" name="correo" required pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Formato de correo inválido">
          </div>
          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="text" class="form-control" id="telefono" name="telefono" required pattern="\d{9}" title="Debe tener exactamente 9 números">
          </div>
          <div class="mb-3">
            <label for="comentarios" class="form-label">Comentarios</label>
            <textarea class="form-control" id="comentarios" name="comentarios" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Enviar</button>
          <button type="reset" class="btn btn-secondary">Limpiar</button>
        </form>
      </div>
      <div class="col-md-6">
        <iframe id="mapa" class="mapa" src="https://maps.google.com/maps?q=38.3571915,-0.4844547&t=&z=13&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-primary text-white p-4 mt-5">
    <div class="row">
      <div class="col-md-4">
        <h5>Focus Studios</h5>
        <p>© 2025 Todos los derechos reservados.<br>Aviso legal y política de privacidad.</p>
      </div>
      <div class="col-md-4">
        <h5>Enlaces</h5>
        <ul class="list-unstyled">
          <li><a href="index.html" class="text-white">Inicio</a></li>
          <li><a href="galeria.html" class="text-white">Portafolio</a></li>
          <li><a href="contacto.html" class="text-white">Contacto</a></li>
        </ul>
      </div>
      <div class="col-md-4">
        <h5>Redes Sociales</h5>
        <a href="https://www.facebook.com/" class="text-white me-2">Facebook</a>
        <a href="https://www.instagram.com/" class="text-white me-2">Instagram</a>
        <a href="https://x.com/" class="text-white">Twitter</a>
      </div>
    </div>
  </footer>

  <script>
    // Intentar usar ubicación del usuario
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        document.getElementById("mapa").src = `https://maps.google.com/maps?q=${lat},${lon}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
      }, function(error) {
        // Si no hay permiso o error, usar ubicación de MasterD Alicante
        document.getElementById("mapa").src = "https://maps.google.com/maps?q=38.3571915,-0.4844547&t=&z=13&ie=UTF8&iwloc=&output=embed";
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
